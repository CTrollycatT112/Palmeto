name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and build kernel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install AArch64 linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust components
        run: rustup component add rust-src llvm-tools-preview clippy

      - name: Check workspace
        run: cargo check --workspace -Zjson-target-spec

      - name: Run Clippy
        run: RUSTFLAGS="-Zunstable-options -A unused_features" cargo clippy --workspace -Zjson-target-spec -- --no-deps

      - name: Build kernel
        run: cargo build --profile dev -Zjson-target-spec
