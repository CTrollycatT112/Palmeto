name: Label pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Ensure project labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = {
              kernel: '1d76db',
              init: '1d76db',
              drivers: '1d76db',
              shared: '1d76db',
              bindings: '5319e7',
              build: 'fbca04',
              documentation: '0075ca',
              ci: '0e8a16',
            };

            for (const [name, color] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                });
              }
            }

      - name: Apply component label from title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^\[([A-Z0-9_-]+)\]:\s+\S.*$/);

            if (!match) {
              core.info('Skipping component label because the title is invalid.');
              return;
            }

            const component = match[1].toUpperCase();
            const color = '6f42c1';

            const currentLabels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const label of currentLabels.data) {
              if (label.color.toLowerCase() === color && label.name !== component) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: component,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: component,
                color,
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [component],
            });

      - name: Apply path labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
